[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-agent"
version = "0.1.0"
description = "Conversational movie-discovery agent over MovieLens: LLM planning over deterministic CF / content tools"
authors = [{ name = "Võ Trần Công" }]
requires-python = ">=3.10"
readme = "SOLUTION.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
movie-agent = "movie_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # tests build many throwaway in-memory stores; the app opens one store per process and keeps it
    "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
source = ["movie_agent"]

[tool.coverage.report]
show_missing = false
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["outputs", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is the formatter's job; long strings/comments are left as written
    "B905",  # zip(strict=...): the zipped sequences are built together and always equal length
]

[tool.ruff.lint.isort]
known-first-party = ["movie_agent", "eval"]
